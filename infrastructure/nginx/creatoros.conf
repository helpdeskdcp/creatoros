# CreatorOS reverse proxy. Routes /api and /docs to the backend container,
# everything else to the Next.js frontend. Terminate TLS in front of this
# (e.g. a host-level Nginx or a load balancer) — this config is HTTP-only,
# intended to sit behind that.

upstream creatoros_backend {
    server backend:8000;
}

upstream creatoros_frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 2G;  # large video uploads pass through to YouTube

    location /health {
        proxy_pass http://creatoros_backend/health;
    }

    location /api/ {
        proxy_pass http://creatoros_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location ~ ^/(docs|redoc)$ {
        proxy_pass http://creatoros_backend;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://creatoros_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
